# ---------------------------------------------------------------------------
# باهم 💑 — Cloudflare Pages
# فرانت: Next.js static export (پوشه out/) · بک‌اند: functions/api (Pages Functions)
# ---------------------------------------------------------------------------
name = "baham"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"

# --- KV ها (وصل شدن ✅) ---
# چون این بایندینگ‌ها اینجان، بخش Bindings توی داشبورد قفله (طبیعیه!)
# سکرت‌ها (ADMIN_PASSWORD و AUTH_SECRET) همچنان از داشبورد ست می‌شن.
[[kv_namespaces]]
binding = "CONFIG"
id = "f1a2236876da4ac6859c0e455e076d54"

[[kv_namespaces]]
binding = "STATS"
id = "8590e4afbb73413e83b073f5763d7229"

# --- سکرت‌ها (هرگز اینجا ننویس!) ---
# با این دستورها ست کن (برای Production و Preview جدا):
#   wrangler pages secret put ADMIN_PASSWORD --project-name=baham
#   wrangler pages secret put AUTH_SECRET --project-name=baham
# یا از داشبورد: پروژه > Settings > Environment variables > Add variable
