# ---------------------------------------------------------------------------
# باهم 💑 — Cloudflare Pages
# فرانت: Next.js static export (پوشه out/) · بک‌اند: functions/api (Pages Functions)
# ---------------------------------------------------------------------------
name = "baham"
compatibility_date = "2025-06-01"
pages_build_output_dir = "out"

# --- KV ها ---
# روش پیشنهادی: از داشبورد ست کن (راهنما: DEPLOY.md قدم ۲)
# یعنی: پروژه > Settings > Functions > KV namespace bindings
#   CONFIG -> baham-config
#   STATS  -> baham-stats
#
# اگه با CLI دیپلوی می‌کنی، اول بساز:
#   wrangler kv namespace create baham-config
#   wrangler kv namespace create baham-stats
# بعد کامنت‌های زیر رو باز کن و id ها رو بذار:
# [[kv_namespaces]]
# binding = "CONFIG"
# id = "PUT_BAHAM_CONFIG_KV_ID_HERE"
#
# [[kv_namespaces]]
# binding = "STATS"
# id = "PUT_BAHAM_STATS_KV_ID_HERE"

# --- سکرت‌ها (هرگز اینجا ننویس!) ---
# با این دستورها ست کن (برای Production و Preview جدا):
#   wrangler pages secret put ADMIN_PASSWORD --project-name=baham
#   wrangler pages secret put AUTH_SECRET --project-name=baham
# یا از داشبورد: پروژه > Settings > Environment variables > Add variable
